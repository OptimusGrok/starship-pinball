<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Starship Pinball</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;position:absolute;left:0;top:0}
</style></head><body>
<canvas id="c"></canvas>
<script>
"use strict";
(function(){
const W=400,H=800,DH=66,BR=9,GRAV=1050,MAXV=2300,SUB=12;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const P=new URLSearchParams(location.search);
let SST=[],scale=1,offX=0,offY=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';scale=innerWidth/W;if((H+DH)*scale>innerHeight*1.025)scale=innerHeight/(H+DH);SST=[];for(let i=0;i<Math.round(innerWidth*innerHeight/1500);i++)SST.push([Math.random()*innerWidth,Math.random()*innerHeight,Math.random()*1.5+.3,Math.random()*6]);offX=(innerWidth-W*scale)/2;offY=(innerHeight-(H+DH)*scale)/2;}
addEventListener('resize',resize);resize();

// ---------- audio ----------
let AC=null,muted=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type,vol,f2){const a=AC;if(!a||muted)return;const t=a.currentTime,o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,vol,fc){const a=AC;if(!a||muted)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=fc||1200;const g=a.createGain();g.gain.value=vol||.2;s.connect(f);f.connect(g);g.connect(a.destination);s.start();}
const SFX={
 bump(){tone(520,.12,'square',.07,260);},
 sling(){tone(330,.08,'sawtooth',.06,180);},
 flip(){tone(140,.05,'triangle',.08,90);},
 target(){tone(880,.1,'square',.06,660);},
 lane(){tone(1200,.08,'sine',.07,1600);},
 launch(){noise(.9,.25,900);tone(80,.8,'sawtooth',.06,40);},
 orbit(){[0,1,2,3].forEach(i=>setTimeout(()=>tone(500+i*200,.12,'square',.06),i*70));},
 drain(){tone(400,.6,'sawtooth',.08,60);},
 jackpot(){[0,1,2,3,4,5,6,7].forEach(i=>setTimeout(()=>tone(400+i*120,.15,'square',.07),i*80));noise(1,.2,3000);},
 beep(){tone(1000,.12,'sine',.08);},
 tilt(){tone(90,.5,'square',.1,70);}
};

// ---------- geometry ----------
const segs=[],circles=[];
function seg(ax,ay,bx,by,o){const s=Object.assign({ax,ay,bx,by,e:.45,kick:0,alive:true},o||{});segs.push(s);return s;}
function poly(pts,o){for(let i=0;i<pts.length-1;i++)seg(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],o);}
function arc(cx,cy,r,a0,a1,n,o){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]);}poly(p,o);return p;}
// outer shell
seg(10,800,10,200);
const outerArc=arc(200,200,190,Math.PI,2*Math.PI,40);
seg(390,200,390,800);
// plunger lane wall
seg(362,800,362,250,{e:.3});
// inner orbit arc + left orbit wall
const innerArc=arc(200,200,158,Math.PI,Math.PI*2-0.44,34,{e:.4});
seg(42,200,42,395);seg(10,405,54,452,{e:.35});
// starlink rollover lane guides
const laneX=[155,185,215,245];laneX.forEach(x=>seg(x,64,x,98,{e:.4}));
// inlanes
poly([[42,560],[42,650],[106,698]],{e:.3});
poly([[330,560],[330,650],[266,698]],{e:.3});
// slingshots
seg(70,570,70,640,{e:.3});seg(70,640,100,662,{e:.3});
const slL=seg(70,570,100,662,{kick:520,e:.5,sling:1});
seg(302,570,302,640,{e:.3});seg(302,640,272,662,{e:.3});
const slR=seg(272,662,302,570,{kick:520,e:.5,sling:1});
// lower guide posts so ball can't sit on top of slings
// drop targets (Booster Landing) on left
const drops=[];for(let i=0;i<4;i++){const y=290+i*27;drops.push(seg(50,y,50,y+20,{e:.35,drop:1,idx:i}));}
seg(42,286,50,288);seg(42,398,50,398);
// right side upper deflector
seg(340,300,330,420,{e:.4});
// bumpers
const bumpers=[[158,170],[242,170],[200,232]].map(p=>{const c={x:p[0],y:p[1],r:19,kick:420,bumper:1,flash:0};circles.push(c);return c;});
// chopsticks target (Mechazilla tower)
const tower={x:186,y:430,r:11,kick:120,tower:1,flash:0};circles.push(tower);
// small posts at inlane/outlane tops
circles.push({x:42,y:560,r:4,kick:0});circles.push({x:330,y:560,r:4,kick:0});

// flippers
function mkFlip(px,py,s){return{px,py,s,len:62,a:.52,rest:.52,up:-.45,w:0,on:false};}
const flips=[mkFlip(108,700,1),mkFlip(264,700,-1)];
function tip(f){return[f.px+f.s*Math.cos(f.a)*f.len,f.py+Math.sin(f.a)*f.len];}

// ---------- game state ----------
const G={state:'title',score:0,ball:1,balls:[],hi:+(localStorage.getItem('sxpb_hi')||0),mult:1,
 lanes:[0,0,0],mars:0,catchLit:false,save:0,cd:0,cdShown:-1,plunger:0,plHold:false,tiltWarn:0,tilted:false,
 msg:'',msgT:0,shake:0,t:0,stats:{bumps:0,flips:0,drains:0,escapes:0,stuck:0,launches:0,orbits:0,maxBalls:0,games:0},
 extraQueue:0,extraT:0,bot:P.has('bot'),over:0,mb:false,newHi:false};
const MARS=['LAUNCH','ORBIT','REFUEL','MARS','LANDING'];
const parts=[],pops=[];
function say(m,t){G.msg=m;G.msgT=t||2;}
function add(p,x,y){p*=G.mult;G.score+=p;if(x!=null)pops.push({x,y,t:1,s:'+'+p.toLocaleString()});}
function burst(x,y,n,col,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=(sp||200)*Math.random();parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:.4+Math.random()*.5,c:col});}}
function newBall(){return{x:376,y:771,vx:0,vy:0,lane:true,launched:false,still:0,orbL:false,orbR:false,fromLane:false,laneWait:0,trail:[]};}
function serve(){const b=newBall();G.balls.push(b);G.cd=3;G.cdShown=-1;G.plunger=0;return b;}
function startGame(){ac();G.state='play';G.score=0;G.ball=1;G.balls=[];G.lanes=[0,0,0];G.mars=0;G.catchLit=false;G.mult=1;G.tilted=false;G.tiltWarn=0;G.mb=false;G.newHi=false;drops.forEach(d=>d.alive=true);G.stats.games++;serve();say('BALL 1',1.5);}
function marsStep(i,x,y){if(G.mars===i){G.mars++;add(25000*G.mars,x,y);say(MARS[i]+' ✓',1.6);SFX.orbit();if(G.mars===5){add(1000000,200,420);say('JACKPOT!',3);SFX.jackpot();G.shake=14;burst(200,420,80,'#ff6a2a',420);G.mars=0;}}}
function launch(b,p){b.vy=-(1080+760*p);b.vx=0;b.lane=false;b.launched=true;b.fromLane=true;G.stats.launches++;SFX.launch();G.shake=Math.max(G.shake,5);
 for(let i=0;i<40;i++)parts.push({x:376+(Math.random()-.5)*10,y:790,vx:(Math.random()-.5)*80,vy:100+Math.random()*250,t:.6+Math.random()*.5,c:Math.random()<.5?'#ffb347':'#ff5a1f'});
 if(G.save<=0&&!G.mb&&!b.relaunch)G.save=8; if(G.balls.length===1&&!b.relaunch)marsStep(0,376,300);}
function startMultiball(){if(G.mb)return;G.mb=true;G.extraQueue=2;G.extraT=.6;G.save=12;say('MULTIBALL!',3);SFX.jackpot();G.shake=12;}
function nudge(dx){if(G.state!=='play'||G.tilted)return;G.balls.forEach(b=>{if(!b.lane){b.vx+=dx*140;b.vy-=110;}});G.shake=6;G.tiltWarn+=1;if(G.tiltWarn>=3){G.tilted=true;say('TILT',3);SFX.tilt();flips.forEach(f=>f.on=false);}else{say('DANGER '+G.tiltWarn,1);SFX.beep();}}

// ---------- physics ----------
function collideSeg(b,s,dt){if(!s.alive)return;const ex=s.bx-s.ax,ey=s.by-s.ay,l2=ex*ex+ey*ey;let t=((b.x-s.ax)*ex+(b.y-s.ay)*ey)/l2;t=t<0?0:t>1?1:t;const px=s.ax+ex*t,py=s.ay+ey*t;let dx=b.x-px,dy=b.y-py,d2=dx*dx+dy*dy;if(d2>=BR*BR)return;let d=Math.sqrt(d2);if(d<1e-6){dx=-ey;dy=ex;d=Math.sqrt(dx*dx+dy*dy);}const nx=dx/d,ny=dy/d;b.x=px+nx*BR;b.y=py+ny*BR;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;b.vx*=.995;b.vy*=.995;}
 if(s.sling&&vn<-60&&!G.tilted){b.vx+=nx*s.kick;b.vy+=ny*s.kick;add(110,b.x,b.y);SFX.sling();s.flash=.15;burst(b.x,b.y,8,'#3cf');}
 if(s.drop&&vn<-40){s.alive=false;add(2500,b.x,b.y);SFX.target();burst(b.x,b.y,14,'#ffd166');if(drops.every(q=>!q.alive)&&!G.catchLit){G.catchLit=true;say('CATCH THE BOOSTER!',2.5);SFX.orbit();}}}
function collideCirc(b,c){let dx=b.x-c.x,dy=b.y-c.y,R=BR+c.r,d2=dx*dx+dy*dy;if(d2>=R*R)return;let d=Math.sqrt(d2)||1e-3;const nx=dx/d,ny=dy/d;b.x=c.x+nx*R;b.y=c.y+ny*R;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;}
 if(c.kick&&!G.tilted&&(c.flash<=0.05)){b.vx+=nx*c.kick;b.vy+=ny*c.kick;c.flash=.18;
  if(c.bumper){add(1000,c.x,c.y-20);G.stats.bumps++;SFX.bump();G.shake=Math.max(G.shake,3);burst(c.x+nx*c.r,c.y+ny*c.r,12,'#ff3df2',260);}
  if(c.tower){if(G.catchLit){G.catchLit=false;add(100000,c.x,c.y-20);say('BOOSTER CAUGHT!',2.5);SFX.jackpot();G.shake=10;burst(c.x,c.y,60,'#9ff',380);drops.forEach(q=>q.alive=true);marsStep(3,c.x,c.y);startMultiball();}else{add(500,c.x,c.y-15);SFX.target();}}}}
function collideFlip(b,f,w){const[tx,ty]=tip(f);const ex=tx-f.px,ey=ty-f.py,l2=ex*ex+ey*ey;let t=((b.x-f.px)*ex+(b.y-f.py)*ey)/l2;t=t<0?0:t>1?1:t;const px=f.px+ex*t,py=f.py+ey*t,rr=8.5-4*t,R=BR+rr;let dx=b.x-px,dy=b.y-py,d2=dx*dx+dy*dy;if(d2>=R*R)return;let d=Math.sqrt(d2)||1e-3;const nx=dx/d,ny=dy/d;b.x=px+nx*R;b.y=py+ny*R;
 const rx=px-f.px,ry=py-f.py,sx=-w*ry,sy=w*rx;const rvx=b.vx-sx,rvy=b.vy-sy,vn=rvx*nx+rvy*ny;if(vn<0){const e=.28;b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;}}
function ballBall(a,b){let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy,R=2*BR;if(d2>=R*R||d2===0)return;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,o=(R-d)/2;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;const vn=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;if(vn<0){const j=-(1.9)*vn/2;a.vx-=j*nx;a.vy-=j*ny;b.vx+=j*nx;b.vy+=j*ny;}}

function physics(dt){
 const h=dt/SUB;
 for(let k=0;k<SUB;k++){
  flips.forEach(f=>{const tgt=(f.on&&!G.tilted)?f.up:f.rest;const sp=f.on?30:16;const old=f.a;if(f.a<tgt)f.a=Math.min(tgt,f.a+sp*h);else f.a=Math.max(tgt,f.a-sp*h);f.w=f.s*(f.a-old)/h;});
  for(const b of G.balls){
   if(b.lane&&!b.launched||b.held){b.x=376;b.y=771;b.vx=b.vy=0;continue;}
   b.vy+=GRAV*h;const v=Math.hypot(b.vx,b.vy);if(v>MAXV){b.vx*=MAXV/v;b.vy*=MAXV/v;}
   b.x+=b.vx*h;b.y+=b.vy*h;
   for(const s of segs)collideSeg(b,s,h);
   for(const c of circles)collideCirc(b,c);
   for(const f of flips)collideFlip(b,f,f.w);
   // plunger floor in lane
   if(b.x>362&&b.y>771){b.y=771;if(b.vy>0)b.vy*=-.2;}
  }
  for(let i=0;i<G.balls.length;i++)for(let j=i+1;j<G.balls.length;j++)ballBall(G.balls[i],G.balls[j]);
 }
 circles.forEach(c=>c.flash=Math.max(0,c.flash-dt));segs.forEach(s=>{if(s.flash)s.flash=Math.max(0,s.flash-dt);});
}

// ---------- rules per frame ----------
function rules(dt){
 for(let i=G.balls.length-1;i>=0;i--){const b=G.balls[i];
  // escape guard
  if(!(b.x>-5&&b.x<405&&b.y>-25&&isFinite(b.x)&&isFinite(b.y))){G.stats.escapes++;G.balls.splice(i,1);const nb=newBall();G.balls.push(nb);continue;}
  // trail
  b.trail.push([b.x,b.y]);if(b.trail.length>8)b.trail.shift();
  // starlink lanes
  for(let l=0;l<3;l++){const cx=170+l*30;if(Math.abs(b.x-cx)<15&&b.y>66&&b.y<96&&!b['ln'+l]){b['ln'+l]=1;if(!G.lanes[l]){G.lanes[l]=1;add(5000,cx,80);SFX.lane();if(G.lanes.every(x=>x)){add(50000,200,90);say('STARLINK ONLINE',2);marsStep(2,200,90);G.lanes=[0,0,0];G.mult=Math.min(5,G.mult+1);say('STARLINK x'+G.mult,2);}}}else if(b.y>110)b['ln'+l]=0;}
  // orbits
  const dc=Math.hypot(b.x-200,b.y-200);
  if(b.x<42&&b.y>220&&b.y<430&&b.vy<0&&!b.fromLane)b.orbL=true;
  if(b.x>343&&b.y>140&&b.y<250&&b.x<362&&b.vy<0)b.orbR=true;
  if(b.orbL&&b.x>300&&b.y<200&&dc>158){b.orbL=false;orbitAward(b);}
  if(b.x<42&&b.y>300&&b.vy>0){if(b.orbR&&!b.fromLane)orbitAward(b);b.orbR=false;b.fromLane=false;}
  if(b.x>362&&b.y>300)b.orbR=false;
  // ball returning to plunger lane: auto relaunch
  if(b.launched&&b.x>362&&b.y>760&&Math.abs(b.vy)<40){b.laneWait+=dt;if(b.laneWait>.5){b.laneWait=0;b.relaunch=true;launch(b,.8);}}
  // stuck detector
  const sp=Math.hypot(b.vx,b.vy);if(!b.lane&&b.launched&&sp<12&&b.x<362){b.still+=dt;if(b.still>3){b.still=0;G.stats.stuck++;b.vy=-500;b.vx=(Math.random()-.5)*300;say('BALL SEARCH',1);}}else b.still=0;
  // drain
  if(b.y>812&&b.x<362){G.balls.splice(i,1);G.stats.drains++;
   if(G.save>0&&!G.tilted){const nb=serve();G.cd=0;nb.relaunch=true;setT(()=>{if(nb.lane)launch(nb,.85)},.8);say('BALL SAVED',2);SFX.beep();}
   else if(G.balls.length===0){endBall();}
   else if(G.balls.length===1){G.mb=false;say('MULTIBALL OVER',1.5);}
  }
 }
 if(G.balls.length===1&&G.mb&&G.extraQueue===0)G.mb=false;
 if(G.extraQueue>0){G.extraT-=dt;if(G.extraT<=0){G.extraQueue--;G.extraT=1.2;const b=newBall();G.balls.push(b);b.relaunch=true;launch(b,.9);}}
 G.stats.maxBalls=Math.max(G.stats.maxBalls,G.balls.length);
 if(G.save>0)G.save-=dt;
 // countdown on served ball
 const w=G.balls.find(b=>b.lane&&!b.launched);
 if(w&&G.state==='play'){if(G.cd>0){G.cd-=dt;const n=Math.ceil(G.cd);if(n!==G.cdShown&&n>0){G.cdShown=n;say('T-MINUS '+n,1);SFX.beep();}if(G.cd<=0&&!G.plHold){say('LIFTOFF!',1.4);launch(w,.82);}}
  if(G.plHold)G.plunger=Math.min(1,G.plunger+dt*1.4);}
}
function orbitAward(b){G.stats.orbits++;add(25000,b.x,b.y);say('REACH ORBIT!',1.8);SFX.orbit();G.shake=6;if(G.mars===1)marsStep(1,b.x,b.y);else if(G.mars===4)marsStep(4,b.x,b.y);}
function endBall(){SFX.drain();G.shake=10;const bonus=G.stats.bumps*10;G.mult=1;G.tilted=false;G.tiltWarn=0;G.mb=false;G.save=0;
 if(G.ball>=3){G.state='over';G.over=0;if(G.score>G.hi){G.hi=G.score;G.newHi=true;try{localStorage.setItem('sxpb_hi',G.hi)}catch(e){}}say('',0);}
 else{G.ball++;serve();say('BALL '+G.ball,1.5);}}
const timers=[];function setT(f,t){timers.push({f,t});}

// ---------- bot ----------
let botT=[0,0];
function bot(dt){flips.forEach((f,i)=>{let want=false;for(const b of G.balls){if(b.lane)continue;const dx=b.x-f.px,dy=b.y-f.py;const side=i===0?b.x<190:b.x>182;if(side&&dy>-40&&dy<40&&Math.abs(dx)<75&&b.vy>-50)want=true;}if(want&&botT[i]<=0)botT[i]=.18;botT[i]-=dt;setFlip(i,botT[i]>0);});}

function setFlip(i,on){const f=flips[i];if(on&&!f.on&&G.state==='play'&&!G.tilted){SFX.flip();G.stats.flips++;}f.on=on;}

// ---------- tick ----------
function tick(dt){G.t+=dt;
 for(let i=timers.length-1;i>=0;i--){timers[i].t-=dt;if(timers[i].t<=0){const f=timers[i].f;timers.splice(i,1);f();}}
 if(G.state==='play'){if(G.bot)bot(dt);physics(dt);rules(dt);}
 else if(G.state==='over'){G.over+=dt;if(G.bot&&G.over>2)startGame();}
 else if(G.state==='title'&&G.bot&&G.t>1)startGame();
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.t-=dt;if(p.t<=0)parts.splice(i,1);}
 for(let i=pops.length-1;i>=0;i--){pops[i].t-=dt;pops[i].y-=30*dt;if(pops[i].t<=0)pops.splice(i,1);}
 if(G.msgT>0)G.msgT-=dt;G.shake*=Math.pow(.02,dt);
 // ambient engine particles on Starship art
 if(Math.random()<.5)parts.push({x:186+(Math.random()-.5)*14,y:610,vx:(Math.random()-.5)*20,vy:60+Math.random()*60,t:.5,c:'rgba(255,140,40,.6)',amb:1});
}

// ---------- render ----------
const stars=[];for(let i=0;i<220;i++)stars.push([Math.random()*W,Math.random()*H,Math.random()*1.4+.2,Math.random()*6]);
function neon(c,w,blur){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.shadowColor=c;ctx.shadowBlur=blur||10;}
function drawFalcon(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.shadowBlur=0;
 ctx.fillStyle='#e8edf5';ctx.fillRect(-6,-70,12,120);ctx.fillStyle='#2a2f3a';ctx.fillRect(-6,-10,12,4);ctx.fillRect(-6,30,12,3);
 ctx.beginPath();ctx.moveTo(-6,-70);ctx.quadraticCurveTo(0,-95,6,-70);ctx.fillStyle='#f4f6fa';ctx.fill();
 ctx.fillStyle='#9aa3b5';ctx.fillRect(-10,40,4,12);ctx.fillRect(6,40,4,12);ctx.fillStyle='#555';ctx.fillRect(-5,50,10,5);
 ctx.fillStyle='#1b2030';ctx.font='bold 7px sans-serif';ctx.save();ctx.rotate(-Math.PI/2);ctx.fillText('FALCON',-5,3);ctx.restore();
 const fl=8+Math.random()*8;const g=ctx.createLinearGradient(0,55,0,55+fl*3);g.addColorStop(0,'#fff6c0');g.addColorStop(.4,'#ff9a2a');g.addColorStop(1,'rgba(255,60,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-5,55);ctx.lineTo(0,55+fl*3);ctx.lineTo(5,55);ctx.fill();ctx.restore();}
function drawStarship(x,y,s){ctx.save();ctx.translate(x,y);ctx.scale(s,s);

function tEnd(e){e.preventDefault();for(const t of e.changedTouches){const o=tch[t.identifier];if(!o)continue;delete tch[t.identifier];if(!Object.values(tch).some(q=>q.s===o.s))setFlip(o.s,false);if(o.pl)plUp();}}
